<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us — Rivet.Co</title>
<meta name="description" content="Rivet.Co — premium essentials defined by thoughtful design, clean silhouettes, considered details, and quality fabrics. Shipping across Egypt.">
<meta name="theme-color" content="#111111">
<meta property="og:site_name" content="Rivet.Co">
<meta property="og:title" content="Contact us — Rivet.Co">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="contact">
<div id="chrome-top"></div>
<main id="main">
<div class="container">
  <div class="page-title"><div class="eyebrow">Help</div><h1>Contact us</h1><p>Questions about an order, sizing or returns? Send us a message and we'll get back to you.</p></div>
  <div class="contact-grid">
    <ul class="contact-list" id="contact-list"></ul>
    <form id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="company" novalidate>
      <input type="hidden" name="form-name" value="contact">
      <p class="visually-hidden"><label>Leave this empty <input name="company"></label></p>
      <div class="two">
        <div class="field"><label for="c-name">Name</label><input id="c-name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="c-phone">Phone (optional)</label><input id="c-phone" name="phone" type="tel" autocomplete="tel"></div>
      </div>
      <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="c-order">Order reference (optional)</label><input id="c-order" name="order"></div>
      <div class="field"><label for="c-msg">Message</label><textarea id="c-msg" name="message" rows="5" required></textarea></div>
      <button class="btn" type="submit">Send</button>
      <div class="form-msg" id="contact-msg" aria-live="polite"></div>
    </form>
  </div>
</div></main>
<div id="chrome-bottom"></div>
<script src="/assets/js/app.js" defer></script>
</body>
</html>
